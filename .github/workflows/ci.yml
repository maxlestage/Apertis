name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: ApertisCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Tests du cœur
        run: swift test --package-path Packages/ApertisCore

  site:
    name: Site web (Rust, Paquets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests du site
        run: cargo test -p apertis-site
      - name: Îlots et laboratoires (WebAssembly)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p apertis-site --lib --target wasm32-unknown-unknown --profile wasm-release

  ios:
    name: Application iOS et iPadOS (Xcode 27)
    # Image GitHub avec Xcode 27 (Swift 6.4, SDK iOS et iPadOS 27).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compiler pour le simulateur
        run: |
          xcodebuild build \
            -project Apertis.xcodeproj \
            -scheme Apertis \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Tests sur simulateur iPhone et iPad
        run: |
          set -o pipefail
          xcodebuild -version
          for model in 'iPhone 1[7-9] Pro' 'iPad Pro'; do
            device=$(xcrun simctl list devices available | grep -m1 -E "$model" | grep -oE '[0-9A-F-]{36}')
            echo "Simulateur : $(xcrun simctl list devices available | grep -m1 -E "$model")"
            xcodebuild test \
              -project Apertis.xcodeproj \
              -scheme Apertis \
              -destination "id=$device,arch=arm64" \
              -only-testing:ApertisTests \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | grep -E "Test Case .*(passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED)"
          done
      - name: Tests du cœur (macOS)
        run: swift test --package-path Packages/ApertisCore
