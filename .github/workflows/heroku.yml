# Déploie le site d'Apertis (site/) sur Heroku à chaque commit sur master, sans la CLI
# Heroku : tout passe par l'API Platform, donc tout se configure depuis un téléphone.
# Heroku construit le site avec le buildpack emk/rust (RustConfig, heroku-build.sh,
# Procfile) sur la pile heroku-26.
#
# Configuration (GitHub → Settings → Secrets and variables → Actions) :
#   - secret   HEROKU_API_KEY   Heroku → Account settings → API Key → Reveal
#   - secret   REPOS_TOKEN      jeton GitHub (lecture) des dépôts privés de Paquets
#   - variable HEROKU_APP_NAME  le nom de l'application (créée si elle n'existe pas)
#   - variable facultative HEROKU_REGION : us (par défaut) ou eu
# Sans HEROKU_API_KEY ou HEROKU_APP_NAME, le déploiement est sauté.

name: Deploy to Heroku

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "app.json"
      - "Procfile"
      - "RustConfig"
      - "heroku-build.sh"
      - ".github/workflows/heroku.yml"
  workflow_dispatch:

concurrency:
  group: heroku
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
      APP: ${{ vars.HEROKU_APP_NAME }}
      REGION: ${{ vars.HEROKU_REGION || 'us' }}
    steps:
      - uses: actions/checkout@v4
      - name: Construire et publier sur Heroku
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY:-}" ] || [ -z "${APP:-}" ]; then
            echo "::notice::Heroku n'est pas configuré : ajoutez le secret HEROKU_API_KEY et la variable HEROKU_APP_NAME (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          api() {
            curl -fsS -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              -H "Content-Type: application/json" "$@"
          }
          info="$RUNNER_TEMP/app.json"
          status=$(curl -sS -o "$info" -w '%{http_code}' \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$APP")
          case "$status" in
            200) echo "Application $APP trouvée." ;;
            404)
              echo "Création de l'application $APP ($REGION)…"
              api -X POST https://api.heroku.com/apps \
                -d "{\"name\":\"$APP\",\"region\":\"$REGION\",\"stack\":\"heroku-26\"}" > "$info" ;;
            401) echo "::error::Heroku a refusé la clé d'API (HEROKU_API_KEY)."; exit 1 ;;
            403) echo "::error::Ce compte Heroku ne peut pas utiliser l'application \"$APP\" (nom peut-être déjà pris)."; exit 1 ;;
            *) echo "::error::Réponse inattendue de Heroku ($status) : $(cat "$info")"; exit 1 ;;
          esac
          if [ "$(jq -r '.build_stack.name' "$info")" = container ]; then
            api -X PATCH "https://api.heroku.com/apps/$APP" -d '{"build_stack":"heroku-26"}' > /dev/null
          fi
          api -X PUT "https://api.heroku.com/apps/$APP/buildpack-installations" \
            -d '{"updates":[{"buildpack":"emk/rust"}]}' > /dev/null
          # Le jeton des dépôts privés, transmis à la compilation par le buildpack.
          if [ -n "${REPOS_TOKEN:-}" ]; then
            jq -n --arg t "$REPOS_TOKEN" '{REPOS_TOKEN: $t}' \
              | api -X PATCH "https://api.heroku.com/apps/$APP/config-vars" -d @- > /dev/null
          fi

          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tgz" HEAD
          sources=$(api -X POST https://api.heroku.com/sources)
          curl -fsS -X PUT -H "Content-Type:" --data-binary @"$RUNNER_TEMP/source.tgz" \
            "$(jq -r '.source_blob.put_url' <<< "$sources")"

          echo "Compilation sur Heroku (la première prend plusieurs minutes)…"
          build=$(api -X POST "https://api.heroku.com/apps/$APP/builds" \
            -d "{\"source_blob\":{\"url\":\"$(jq -r '.source_blob.get_url' <<< "$sources")\",\"version\":\"$GITHUB_SHA\"}}")
          id=$(jq -r '.id' <<< "$build")
          curl -sSN "$(jq -r '.output_stream_url' <<< "$build")" || true

          result=pending
          for _ in $(seq 1 240); do
            result=$(api "https://api.heroku.com/apps/$APP/builds/$id" | jq -r '.status')
            [ "$result" != "pending" ] && break
            sleep 5
          done
          if [ "$result" != "succeeded" ]; then
            echo "::error::La compilation Heroku s'est terminée avec le statut \"$result\"."
            exit 1
          fi
          url=$(api "https://api.heroku.com/apps/$APP" | jq -r '.web_url')
          echo "### 🚀 Déployé sur [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Déployé : $url"
